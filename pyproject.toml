[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modo"
version = "0.3.1"
description = "Compute and explore multi-origin road meeting regions."
authors = [{name = "snowball"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["geographiclib>=2,<3", "networkx>=3.4,<4", "scipy>=1.12,<2"]

[project.optional-dependencies]
app = ["gunicorn>=23,<24"]
test = ["build>=1.2,<2", "pytest>=9.0.3,<10", "ruff>=0.12,<1"]

[project.urls]
Repository = "https://github.com/snowball-projects/modo"

[tool.setuptools.package-data]
modo = ["snapshots.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
