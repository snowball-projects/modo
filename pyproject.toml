[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modo"
version = "0.1.0"
description = "Optimize WGS84 geodesic distances for coordinates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["geographiclib>=2,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

