[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modo"
version = "0.1.0"
description = "Optimize multi-origin geographic and static-road destinations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["geographiclib>=2,<3", "networkx>=3.4,<4", "scipy>=1.12,<2"]

[project.optional-dependencies]
test = ["build>=1.2,<2", "pytest>=8,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
