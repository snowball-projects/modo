name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.6
      - run: uv sync --extra test --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked python -m pytest
      - run: uv run --locked python -m build
